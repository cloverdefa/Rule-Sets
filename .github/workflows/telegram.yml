name: Telegram Notification
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
permissions:
  contents: read
jobs:
  notify:
    name: Send Telegram Notification
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_OUTPUT"

      - name: Get commit changes
        id: changes
        run: |
          tag="${{ steps.release.outputs.tag }}"
          prev_tag=$(git tag --sort=-creatordate | grep -A1 "^${tag}$" | tail -n1)

          if [ -n "$prev_tag" ] && [ "$prev_tag" != "$tag" ]; then
            commits=$(git log "${prev_tag}..${tag}" --pretty=format:'%H')
          else
            commits=$(git log "${tag}" --pretty=format:'%H' -n 10)
          fi

          log=""
          while IFS= read -r hash; do
            [ -n "$hash" ] && log="${log}https://github.com/${GITHUB_REPOSITORY}/commit/${hash}"$'\n'
          done <<< "$commits"

          {
            echo "changes<<EOF"
            echo "$log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.GROUPS_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            📦 儲存庫
            ${{ github.repository }}
            🏷️ 版本
            ${{ steps.release.outputs.tag }}
            📝 變更內容
            ${{ steps.changes.outputs.changes }}
