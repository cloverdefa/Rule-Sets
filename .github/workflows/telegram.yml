name: Telegram Notification

on:
workflow_run:
workflows:
- Release
types:
- completed

permissions:
contents: read

jobs:
notify:
name: Send Telegram Notification
if: ${{ github.event.workflow_run.conclusion == 'success' }}
runs-on: ubuntu-latest

```
steps:
  - name: Get release commits
    id: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      tag=$(gh release view \
        --repo "$GITHUB_REPOSITORY" \
        --json tagName \
        --jq '.tagName')

      previous_tag=$(gh api \
        "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
        --jq '.[].name' |
        grep -v "^${tag}$" |
        head -n 1)

      if [[ -n "$previous_tag" ]]; then
        changes=$(gh api \
          "repos/$GITHUB_REPOSITORY/compare/$previous_tag...$tag" \
          --jq '.commits[] | "- \(.commit.message | split("\n")[0])')
      else
        changes=$(gh api \
          "repos/$GITHUB_REPOSITORY/commits/$tag" \
          --jq '"- \(.commit.message | split("\n")[0])"')
      fi

      {
        echo "tag=$tag"
        echo "changes<<EOF"
        echo "$changes"
        echo "EOF"
      } >> "$GITHUB_OUTPUT"

  - name: Send Telegram notification
    uses: appleboy/telegram-action@v1
    with:
      to: ${{ secrets.GROUPS_ID }}
      token: ${{ secrets.TELEGRAM_TOKEN }}
      message: |
        📦 儲存庫
        ${{ github.repository }}

        📝 Commit 變更內容
        ${{ steps.release.outputs.changes }}
```

