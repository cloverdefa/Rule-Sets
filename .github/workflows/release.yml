name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        (
          github.event.pull_request.head.ref == 'test' ||
          github.event.pull_request.head.ref == 'dev'
        )
      )

    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout main
      # ==============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==============================================================
      # Get next version
      # ==============================================================

      - name: Get next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # ----------------------------------------------------------
          # Find latest semantic version tag
          # ----------------------------------------------------------

          latest_tag="$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )"

          echo "Latest tag: ${latest_tag:-none}"

          # ----------------------------------------------------------
          # Determine release type
          #
          # workflow_dispatch:
          #   Use manually selected release type.
          #
          # pull_request:
          #   Determine from Conventional Commits.
          #
          # Priority:
          #   MAJOR > MINOR > PATCH
          #
          # MAJOR:
          #   feat!: ...
          #   fix!: ...
          #   refactor!: ...
          #   BREAKING CHANGE: ...
          #
          # MINOR:
          #   feat: ...
          #
          # PATCH:
          #   fix: ...
          #
          # NO RELEASE:
          #   docs: ...
          #   chore: ...
          #   refactor: ...
          #   test: ...
          #   style: ...
          #   ci: ...
          # ----------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            release_type="${{ inputs.release_type }}"

            echo "Trigger: workflow_dispatch"
            echo "Release type: $release_type"

          else

            release_type="none"

            echo "Trigger: pull_request"
            echo "Analyzing commits since latest release..."

            # --------------------------------------------------------
            # Find commits since latest release
            # --------------------------------------------------------

            if [ -z "$latest_tag" ]; then
              commit_range="HEAD"
            else
              commit_range="${latest_tag}..HEAD"
            fi

            while IFS= read -r commit; do

              echo "Commit:"
              echo "$commit"

              # ------------------------------------------------------
              # MAJOR
              # ------------------------------------------------------

              if printf '%s\n' "$commit" |
                grep -Eq '^[a-zA-Z0-9_-]+(\([^)]*\))?!:' ||
                printf '%s\n' "$commit" |
                grep -Eq 'BREAKING CHANGE:'; then

                release_type="major"
                continue
              fi

              # ------------------------------------------------------
              # MINOR
              # ------------------------------------------------------

              if printf '%s\n' "$commit" |
                grep -Eq '^feat(\([^)]*\))?:'; then

                if [ "$release_type" != "major" ]; then
                  release_type="minor"
                fi

                continue
              fi

              # ------------------------------------------------------
              # PATCH
              # ------------------------------------------------------

              if printf '%s\n' "$commit" |
                grep -Eq '^fix(\([^)]*\))?:'; then

                if [ "$release_type" = "none" ]; then
                  release_type="patch"
                fi

                continue
              fi

            done < <(
              git log "$commit_range" \
                --pretty=format:'%s%n%b%n---'
            )

            echo "Detected release type: $release_type"

            # --------------------------------------------------------
            # No release required
            # --------------------------------------------------------

            if [ "$release_type" = "none" ]; then

              echo "No release required."

              echo "should_release=false" >> "$GITHUB_OUTPUT"

              exit 0

            fi

          fi

          # ----------------------------------------------------------
          # Validate release type
          # ----------------------------------------------------------

          case "$release_type" in
            patch|minor|major)
              ;;
            *)
              echo "::error::Invalid release type: $release_type"
              exit 1
              ;;
          esac

          # ----------------------------------------------------------
          # Calculate next version
          # ----------------------------------------------------------

          if [ -z "$latest_tag" ]; then

            case "$release_type" in
              patch)
                major=0
                minor=1
                patch=1
                ;;

              minor)
                major=0
                minor=2
                patch=0
                ;;

              major)
                major=1
                minor=0
                patch=0
                ;;
            esac

          else

            version="${latest_tag#v}"

            IFS='.' read -r major minor patch <<< "$version"

            case "$release_type" in
              patch)
                patch=$((patch + 1))
                ;;

              minor)
                minor=$((minor + 1))
                patch=0
                ;;

              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
            esac

          fi

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          # ----------------------------------------------------------
          # Prevent duplicate tag
          # ----------------------------------------------------------

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "Release type: $release_type"
          echo "Next version: $version"
          echo "Next tag: $tag"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Create Release
      # ==============================================================

      - name: Create Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
